name: Generate Knowledge Graph

on:
  workflow_call:
    inputs:
      source_repository:
        description: Repository to read content from.
        required: false
        type: string
      source_ref:
        description: Ref to read content from.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      source_repository:
        description: Repository to read content from.
        required: false
        type: string
      source_ref:
        description: Ref to read content from.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: generate-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      PUBLISH_DIR: ${{ github.workspace }}/site

    steps:
      - name: Resolve workflow repository
        id: workflow-repo
        run: |
          job_ref='${{ github.job_workflow_ref }}'
          wf_ref='${{ github.workflow_ref }}'
          echo "job_workflow_ref=$job_ref"
          echo "workflow_ref=$wf_ref"
          # This reusable workflow lives in soranjiro/.knowledge. Always
          # checkout from there so the generator script is available, even
          # when called from another repository (where github.workflow_ref
          # points at the caller, not this workflow's repo).
          repository="soranjiro/.knowledge"
          # Try to honor the ref the caller pinned this workflow to.
          if [ -n "$job_ref" ] && [[ "$job_ref" == "$repository"/* ]]; then
            ref="${job_ref#*@}"
          else
            ref="main"
          fi
          echo "Resolved repository=$repository ref=$ref"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: ${{ (github.event_name == 'workflow_call' && inputs.source_repository) || (github.event_name == 'workflow_dispatch' && github.event.inputs.source_repository) || github.repository }}
          ref: ${{ (github.event_name == 'workflow_call' && inputs.source_ref) || (github.event_name == 'workflow_dispatch' && github.event.inputs.source_ref) || github.ref }}
          path: source
          fetch-depth: 0

      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.workflow-repo.outputs.repository }}
          ref: ${{ steps.workflow-repo.outputs.ref }}
          path: workflow
          fetch-depth: 0

      - name: Verify workflow checkout
        run: |
          ls -la workflow
          test -f workflow/generate-graph.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare publish directory
        run: |
          rm -f graph.html source/graph.html workflow/graph.html
          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

      - name: Generate graph
        run: python workflow/generate-graph.py --root source

      - name: Copy graph to publish directory
        run: |
          if [ -f source/graph.html ]; then
            cp source/graph.html "$PUBLISH_DIR/index.html"
          elif [ -f workflow/graph.html ]; then
            cp workflow/graph.html "$PUBLISH_DIR/index.html"
          elif [ -f graph.html ]; then
            cp graph.html "$PUBLISH_DIR/index.html"
          else
            echo "graph.html was not generated" >&2
            exit 1
          fi

      - name: Verify publish output
        run: test -f "$PUBLISH_DIR/index.html"

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ${{ github.workspace }}/site
